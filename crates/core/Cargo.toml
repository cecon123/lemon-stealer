# NOTE: lib name is `hbd_core`, NOT `core` — a crate named `core` would shadow the
# builtin `::core` in the extern prelude and break macro-derives (thiserror etc.).
[package]
name = "hbd_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hbd_core"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }