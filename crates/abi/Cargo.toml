[package]
name = "abi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
windows = { workspace = true }
flate2 = { workspace = true }

# Safety override: this crate is the ONLY place WinAPI/unsafe is allowed (PLAN R4).
# The workspace forbids `unsafe_code`; abi re-enables it deliberately and documents
# every block with a // SAFETY: comment. Everything outside this crate stays forbid.
[lints.rust]
unsafe_code = "allow"