[package]
name = "crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

# lib name is `hbd_crypto` (same pattern as hbd_core) so downstream crates
# don't shadow the builtin `::crypto`.
[lib]
name = "hbd_crypto"

[lints]
workspace = true

[dependencies]
aes = { workspace = true }
cbc = { workspace = true }
aes-gcm = { workspace = true }
sha1 = { workspace = true }
pbkdf2 = { workspace = true }
thiserror = { workspace = true }
# Windows-only DPAPI wrapper (Go: crypto_windows.go → utils/winapi). Layering OK:
# abi sits at the bottom of the crate graph (R1), crypto only calls it on Windows.
abi = { path = "../abi" }

[dev-dependencies]
hex = { workspace = true }