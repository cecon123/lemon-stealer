[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Layering (NO cyclic deps): core <- crypto <- keyring <- browser <- cli
# abi at the bottom, used by keyring/browser/filemanager. Enforced by cargo machete/udeps in CI.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["std", "clock"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"

# Crypto (RUSTCrypto — the Go stdlib equivalents)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
# sha1: deprecated by RustCrypto but REQUIRED for legacy Chrome parity:
# kEmptyKey PBKDF2-HMAC-SHA1 (crbug.com/40055416) and Yandex per-row AAD.
sha1 = "0.10"
pbkdf2 = "0.12"

# WinAPI (in crates/abi only, R4): DPAPI = CryptUnprotectData/ProtectData (crypt32), LocalFree.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security_Cryptography"] }

[workspace.lints.rust]
# All unsafe lives in crates/abi (or #[cfg(windows)] modules there); enforced repo-wide.
unsafe_code = "forbid"

[profile.release]
lto = true
strip = true